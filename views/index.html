<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureForm - Student Registration</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <h1>SecureForm</h1>
        <p>Student Registration with Server-Side Validation</p>

        <form id="registrationForm">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text"
                   minlength="2" maxlength="50" required>

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" required>

            <label for="age">Age</label>
            <input id="age" name="age" type="number"
                   min="16" max="100" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" required>

            <button type="submit">Register Student</button>
        </form>

        <div id="result" role="status" aria-live="polite"></div>
    </main>

    <script>
        const form = document.getElementById("registrationForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            result.textContent = "Submitting...";
            result.className = "";

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    body: new URLSearchParams(new FormData(form)),
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    }
                });

                const data = await response.json();
                result.className = data.success ? "success" : "error";
                result.textContent = [data.message, ...(data.errors || [])].join(" ");

                if (data.success) form.reset();
            } catch (error) {
                result.className = "error";
                result.textContent = "Unable to connect to the server.";
            }
        });
    </script>
</body>
</html>
